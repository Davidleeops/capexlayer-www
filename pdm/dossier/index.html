<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CapexLayer Terminal / Facility Dossier</title>
  <link rel="stylesheet" href="/pdm/styles.css" />
  <style>
    /* Dossier-scoped fallbacks. If styles.css defines these variables they win.
       If styles.css is missing or minimal these keep the page readable. */
    :root {
      --bg: var(--cl-bg, #0b0d12);
      --bg-elev: var(--cl-bg-elev, #11141b);
      --bg-panel: var(--cl-bg-panel, #161a23);
      --fg: var(--cl-fg, #e6e8ee);
      --fg-muted: var(--cl-fg-muted, #8b93a6);
      --fg-dim: var(--cl-fg-dim, #6b7488);
      --border: var(--cl-border, #232838);
      --accent: var(--cl-accent, #22d3ee);
      --good: var(--cl-good, #10b981);
      --warn: var(--cl-warn, #f59e0b);
      --bad: var(--cl-bad, #ef4444);
      --mono: var(--cl-mono, ui-monospace, SFMono-Regular, Menlo, Monaco, "Cascadia Mono", "Roboto Mono", monospace);
      --sans: var(--cl-sans, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif);

      /* Layer colors (per spec) */
      --layer-1: #3b82f6;
      --layer-2: #8b5cf6;
      --layer-3: #f59e0b;
      --layer-4: #10b981;

      /* Tier badge colors */
      --tier-hot: #ef4444;
      --tier-warm: #f59e0b;
      --tier-watch: #22d3ee;
      --tier-noise: #6b7488;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: var(--cl-bg, #f7f8fb);
        --bg-elev: var(--cl-bg-elev, #ffffff);
        --bg-panel: var(--cl-bg-panel, #ffffff);
        --fg: var(--cl-fg, #0b0d12);
        --fg-muted: var(--cl-fg-muted, #4b5266);
        --fg-dim: var(--cl-fg-dim, #6b7488);
        --border: var(--cl-border, #e3e7ef);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Layout */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elev);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--fg-muted);
    }
    .topbar .brand { color: var(--fg); }
    .topbar .brand strong { color: var(--accent); }

    .hero {
      padding: 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elev);
    }
    .hero h1 {
      font-family: var(--mono);
      font-size: 22px;
      margin: 0 0 8px 0;
      letter-spacing: -0.01em;
    }
    .hero .parent {
      font-family: var(--mono);
      color: var(--fg-muted);
      font-size: 13px;
      margin-bottom: 4px;
    }
    .hero .parent .ticker {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 3px;
      margin-left: 6px;
      color: var(--accent);
      font-size: 11px;
    }
    .hero .addr {
      color: var(--fg-muted);
      font-size: 13px;
    }
    .hero .naics {
      display: inline-block;
      font-family: var(--mono);
      font-size: 11px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 3px;
      margin-left: 8px;
      color: var(--fg-muted);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .score-panel { position: static !important; }
    }

    /* Timeline */
    .timeline-head {
      font-family: var(--mono);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--fg-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .timeline-head .count { color: var(--fg); }

    .event {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      border-radius: 4px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .event.layer-1 { border-left-color: var(--layer-1); }
    .event.layer-2 { border-left-color: var(--layer-2); }
    .event.layer-3 { border-left-color: var(--layer-3); }
    .event.layer-4 { border-left-color: var(--layer-4); }

    .event-row1 {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .event-date {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--fg-muted);
      min-width: 90px;
    }
    .layer-badge {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      border-radius: 3px;
      color: #fff;
      font-weight: 600;
    }
    .layer-badge.layer-1 { background: var(--layer-1); }
    .layer-badge.layer-2 { background: var(--layer-2); }
    .layer-badge.layer-3 { background: var(--layer-3); }
    .layer-badge.layer-4 { background: var(--layer-4); }

    .signal-class {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--fg);
    }
    .classifier-label {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--fg-muted);
    }
    .classifier-label.pdm_intent { color: var(--accent); border-color: var(--accent); }
    .classifier-label.cmms_intent { color: var(--warn); border-color: var(--warn); }
    .classifier-label.both { color: var(--good); border-color: var(--good); }

    .source-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--accent);
      margin-left: auto;
      transition: background 0.15s;
    }
    .source-icon:hover { background: var(--bg-panel); text-decoration: none; }
    .source-icon svg { width: 12px; height: 12px; }

    .event-meta {
      display: flex;
      gap: 16px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg-dim);
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .weight-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .weight-pill .label { color: var(--fg-dim); }
    .weight-pill .val { color: var(--fg); }

    .confidence-bar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .confidence-bar .track {
      width: 60px;
      height: 6px;
      background: var(--bg-panel);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .confidence-bar .fill {
      height: 100%;
      background: var(--accent);
    }

    .raw-text {
      font-size: 13px;
      color: var(--fg);
      margin-top: 6px;
      line-height: 1.55;
    }
    .raw-text.collapsed { max-height: 4.4em; overflow: hidden; }
    .toggle-more {
      background: none;
      border: none;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      padding: 4px 0 0 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .toggle-more:hover { text-decoration: underline; }

    /* Score panel */
    .score-panel {
      position: sticky;
      top: 24px;
      align-self: start;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 18px;
    }
    .score-panel h2 {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--fg-muted);
      margin: 0 0 14px 0;
    }
    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .score-row:last-of-type { border-bottom: none; }
    .score-row .label {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--fg-muted);
    }
    .score-row .value {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 600;
      color: var(--fg);
    }
    .tier-badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 3px;
      color: #fff;
      font-weight: 600;
      margin-top: 4px;
    }
    .tier-badge.deployment_imminent, .tier-badge.selection_underway { background: var(--tier-hot); }
    .tier-badge.active_evaluation, .tier-badge.replacement_evaluation { background: var(--tier-warm); }
    .tier-badge.early_interest, .tier-badge.watch_list { background: var(--tier-watch); color: var(--bg); }
    .tier-badge.noise { background: var(--tier-noise); }

    .rationale {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 14px 16px;
      margin-top: 14px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--fg);
    }
    .rationale-head {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--fg-muted);
      margin-bottom: 8px;
    }
    .window-callout {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--bg-elev);
      border: 1px dashed var(--accent);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
    }

    /* Empty / loading states */
    .empty {
      padding: 60px 24px;
      text-align: center;
      color: var(--fg-muted);
    }
    .empty h2 {
      font-family: var(--mono);
      font-size: 18px;
      color: var(--fg);
      margin-bottom: 8px;
    }
    .empty a {
      display: inline-block;
      margin-top: 12px;
      font-family: var(--mono);
      font-size: 12px;
    }

    .footer {
      padding: 18px 24px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg-dim);
      text-align: center;
      letter-spacing: 0.03em;
    }

    .banner {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 6px 24px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg-muted);
      text-align: center;
    }
    .banner.hidden { display: none; }
  </style>
</head>
<body>
  <div id="banner" class="banner hidden"></div>

  <div class="topbar">
    <div class="brand"><strong>CapexLayer</strong> Terminal / Facility Dossier</div>
    <div><a href="/pdm/terminal/">Back to terminal</a></div>
  </div>

  <div id="root">
    <div class="empty" id="loading">
      <h2>Loading dossier</h2>
      <div>Fetching signal history.</div>
    </div>
  </div>

  <div class="footer" id="footer"></div>

  <script>

      SUPABASE_ANON_KEY: "sb_publishable_B8SfhndBe7JUg0j_CtwgDA_uRJc95Ln"
    };
  </script>
  <script src="/pdm/dossier.js"></script>
</body>
</html>
